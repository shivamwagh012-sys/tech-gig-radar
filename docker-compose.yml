version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: techgig-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: techgig
      POSTGRES_PASSWORD: techgig_secret
      POSTGRES_DB: techgig_radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techgig -d techgig_radar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for queue and caching)
  redis:
    image: redis:7-alpine
    container_name: techgig-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techgig-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://techgig:techgig_secret@db:5432/techgig_radar
      REDIS_URL: redis://redis:6379
      # Add your secrets here or use docker secrets
      # TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./generated:/app/generated

volumes:
  postgres_data:
  redis_data:
