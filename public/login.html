<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TechGig Radar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --bg-hover: #1a1a25;
      --border: #2a2a3a;
      --text: #ffffff;
      --text-muted: #8888aa;
      --accent-cyan: #00d4ff;
      --accent-green: #00ff88;
      --accent-red: #ff4757;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .auth-container {
      width: 100%;
      max-width: 420px;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .logo {
      margin-bottom: 15px;
    }
    
    .logo img {
      height: 50px;
      width: auto;
    }
    
    .tagline {
      color: var(--text-muted);
      font-size: 14px;
    }
    
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
    }
    
    .auth-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent-cyan);
      color: var(--bg-dark);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    .btn-primary:hover {
      background: #00b8e0;
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }
    
    .btn-primary:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 25px;
      color: var(--text-muted);
      font-size: 14px;
    }
    
    .auth-footer a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 500;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .success-message {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .success-message.show {
      display: block;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    
    .divider span {
      padding: 0 15px;
    }
    
    .demo-login {
      text-align: center;
      padding: 15px;
      background: var(--bg-hover);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .demo-login code {
      color: var(--accent-cyan);
      background: var(--bg-dark);
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    /* Mobile Responsive */
    @media (max-width: 480px) {
      body { padding: 15px; }
      .auth-container { max-width: 100%; }
      .auth-header { margin-bottom: 25px; }
      .logo img { height: 40px; }
      .tagline { font-size: 12px; }
      .auth-card { padding: 25px 20px; border-radius: 12px; }
      .auth-title { font-size: 20px; }
      .auth-subtitle { font-size: 13px; margin-bottom: 20px; }
      .form-group { margin-bottom: 15px; }
      .form-label { font-size: 13px; }
      .form-input { padding: 12px 14px; font-size: 14px; }
      .btn-primary { padding: 12px; font-size: 15px; }
      .auth-footer { font-size: 13px; margin-top: 20px; }
      .divider { margin: 20px 0; }
      .demo-login { font-size: 12px; padding: 12px; }
      .demo-login code { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo"><img src="/logo.svg" alt="TechGig Radar"></div>
      <div class="tagline">Real Tech News. Real Global Opportunities.</div>
    </div>
    
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to access your dashboard</p>
      
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-input" id="email" name="email" 
                 placeholder="you@example.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" name="password" 
                 placeholder="••••••••" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn-primary" id="submit-btn">
          Sign In
        </button>
      </form>
      
      <div class="auth-footer">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </div>
      
      <div class="divider"><span>or</span></div>
      
      <div class="demo-login">
        Demo: <code>demo@techgig.com</code> / <code>demo123</code>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    
    // Check if already logged in
    const token = localStorage.getItem('techgig_token');
    if (token) {
      window.location.href = '/';
    }
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      errorDiv.classList.remove('show');
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Store token and user
          localStorage.setItem('techgig_token', data.token);
          localStorage.setItem('techgig_user', JSON.stringify(data.user));
          
          successDiv.textContent = 'Login successful! Redirecting...';
          successDiv.classList.add('show');
          
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          errorDiv.textContent = data.error || 'Login failed';
          errorDiv.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (error) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
