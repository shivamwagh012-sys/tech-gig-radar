<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="radar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Radar icon -->
  <g transform="translate(5, 5)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#radar-gradient)" stroke-width="2" opacity="0.3"/>
    <!-- Middle ring -->
    <circle cx="20" cy="20" r="12" fill="none" stroke="url(#radar-gradient)" stroke-width="2" opacity="0.6"/>
    <!-- Inner ring -->
    <circle cx="20" cy="20" r="6" fill="none" stroke="url(#radar-gradient)" stroke-width="2"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="3" fill="#00d4ff"/>
    <!-- Radar sweep line -->
    <line x1="20" y1="20" x2="20" y2="2" stroke="#00d4ff" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- Signal blips -->
    <circle cx="28" cy="12" r="2" fill="#00ff88" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="24" r="1.5" fill="#ff6b35" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- TechGig text -->
  <text x="50" y="28" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
    Tech<tspan fill="url(#radar-gradient)">Gig</tspan>
  </text>
  
  <!-- Radar text -->
  <text x="122" y="28" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#00d4ff">
    Radar
  </text>
  
  <!-- Tagline -->
  <text x="50" y="42" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#8888aa" letter-spacing="1">
    NEWS · JOBS · REELS
  </text>
</svg>
