name: Auto Generate Video Reels

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  generate-reels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Edge TTS
        run: |
          pip install edge-tts
          mkdir -p output/reels temp
      
      - name: Generate reels
        run: node scripts/generate-reels.js
        continue-on-error: false
      
      - name: Show output
        if: always()
        run: |
          echo "=== Output files ==="
          ls -la output/reels/ 2>/dev/null || echo "No output files"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-${{ github.run_number }}
          path: output/reels/
          if-no-files-found: warn
      
      - name: Post to Telegram
        if: success()
        run: node scripts/post-reels-telegram.js || echo "Telegram post skipped"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
