name: Auto Generate Video Reels

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  generate-reels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python and Edge TTS
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts
          mkdir -p output/reels temp
      
      - name: Verify tools
        run: |
          echo "=== Checking FFmpeg ==="
          ffmpeg -version | head -3
          echo ""
          echo "=== Checking Edge TTS ==="
          python3 -m edge_tts --list-voices | head -5
          echo ""
          echo "=== Ready to generate videos ==="
      
      - name: Generate reels
        run: node scripts/generate-reels.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-${{ github.run_number }}
          path: output/reels/
          if-no-files-found: warn
      
      - name: Post to Telegram
        if: success()
        run: |
          if [ -f output/reels/manifest.json ]; then
            node scripts/post-reels-telegram.js
          else
            echo "No manifest found, skipping Telegram post"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
