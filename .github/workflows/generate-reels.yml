name: Auto Generate Video Reels

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  generate-reels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Edge TTS
        run: |
          pip install edge-tts
          mkdir -p output/reels temp
      
      - name: Generate reels
        id: reels
        run: |
          OUTPUT=$(node scripts/generate-reels.cjs 2>&1)
          echo "$OUTPUT"
          REELS_COUNT=$(echo "$OUTPUT" | grep -oP '✅ Generated \K[0-9]+' || echo "0")
          echo "count=$REELS_COUNT" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: Show output
        if: always()
        run: |
          echo "=== Output files ==="
          ls -la output/reels/ 2>/dev/null || echo "No output files"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-${{ github.run_number }}
          path: output/reels/
          if-no-files-found: warn
      
      - name: Post to Telegram
        if: success()
        run: node scripts/post-reels-telegram.cjs || echo "Telegram post skipped"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      
      - name: Send notification
        run: node scripts/send-notification.cjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NEWS_COUNT: "0"
          JOBS_COUNT: "0"
          TECH_JOBS_COUNT: "0"
          HR_JOBS_COUNT: "0"
          REELS_COUNT: ${{ steps.reels.outputs.count }}
