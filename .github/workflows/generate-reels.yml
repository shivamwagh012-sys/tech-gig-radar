name: Auto Generate Video Reels

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-reels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          # Install edge-tts for voice generation
          pip install edge-tts
          
          # Verify installations
          which edge-tts || echo "edge-tts not in PATH, using python -m edge_tts"
          ffmpeg -version | head -1
          
          # Create output directories
          mkdir -p output/reels temp
      
      - name: Generate video reels
        run: |
          node scripts/generate-reels.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      
      - name: List generated files
        run: |
          echo "Generated files:"
          ls -la output/reels/ || echo "No reels generated"
      
      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-reels-${{ github.run_number }}
          path: output/reels/
          retention-days: 7
          if-no-files-found: warn
      
      - name: Post to Telegram
        if: success() && hashFiles('output/reels/manifest.json') != ''
        run: |
          node scripts/post-reels-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
